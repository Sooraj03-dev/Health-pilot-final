name: health_pilot
description: Health monitoring app with AI assistant, vitals tracking, and doctor-patient chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Backend
  supabase_flutter: ^2.0.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # AI
  google_generative_ai: ^0.4.0

  # Health Data (Android)
  health: ^13.3.1

  # Location (SOS)
  geolocator: ^13.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # File Handling (Medical Records)
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # UI Utilities
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.3.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/fonts/
