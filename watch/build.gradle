plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.healthpilot.watch'
    compileSdk 34

    defaultConfig {
        applicationId "com.healthpilot.watch"
        // Wear OS 3 (Galaxy Watch 4+) = API 30; minimum API 26 covers older Tizen-Wear hybrids
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Wear OS core
    implementation 'androidx.wear:wear:1.3.0'

    // Activity (required for registerForActivityResult / ComponentActivity)
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Health Connect – provides HealthConnectClient, PermissionController,
    // HeartRateRecord, OxygenSaturationRecord, SleepSessionRecord, etc.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'

    // Coroutines (used by VitalsManager for suspend reads)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
}
